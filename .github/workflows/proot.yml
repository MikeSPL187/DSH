name: Proot

# proot, talloc и libandroid-shmem для app/src/main/jniLibs — из исходников, рецептами Termux
# закреплённого коммита (infra/proot/termux.lock: в рецептах — SHA-256 архивов исходников) в образе
# сборщика Termux по digest. Результат — библиотеки для двух ABI, SHA256SUMS и исходники (GPL-2.0:
# предложение исходников выполняется релизом рядом с бинарниками). В APK бинарники попадают
# коммитом после сверки SHA256SUMS; релиз proot-v<версия> — только вручную.

on:
  push:
    paths:
      - 'infra/proot/**'
      - '.github/workflows/proot.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Выпустить релиз proot-v<версия proot> с бинарниками и исходниками'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: proot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: aarch64
            abi: arm64-v8a
          - arch: x86_64
            abi: x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: termux-packages закреплённого коммита
        run: |
          . infra/proot/termux.lock
          git init -q termux
          git -C termux fetch -q --depth 1 https://github.com/termux/termux-packages "$TERMUX_PACKAGES_COMMIT"
          git -C termux checkout -q FETCH_HEAD
          test "$(git -C termux rev-parse HEAD)" = "$TERMUX_PACKAGES_COMMIT"

      - name: Сборка из исходников
        working-directory: termux
        run: |
          . ../infra/proot/termux.lock
          # -f: собрать заново, без -I: зависимости тоже из исходников, а не готовые пакеты Termux.
          TERMUX_BUILDER_IMAGE_NAME="$TERMUX_BUILDER_IMAGE" \
            ./scripts/run-docker.sh ./build-package.sh -f -a ${{ matrix.arch }} libandroid-shmem libtalloc proot
          ls -l output

      - name: Библиотеки для APK
        run: |
          sudo apt-get install -y --no-install-recommends patchelf
          sh infra/proot/package.sh termux/output ${{ matrix.abi }} out/jniLibs
          (cd out/jniLibs && sha256sum ${{ matrix.abi }}/*.so)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proot-${{ matrix.abi }}
          path: out/
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true

      - name: Исходники (GPL) и суммы
        run: |
          . infra/proot/termux.lock
          git init -q termux
          git -C termux fetch -q --depth 1 https://github.com/termux/termux-packages "$TERMUX_PACKAGES_COMMIT"
          git -C termux checkout -q FETCH_HEAD
          mkdir -p dist sources
          for pkg in proot libtalloc libandroid-shmem; do
            url=$(bash -c ". termux/packages/$pkg/build.sh 2>/dev/null; echo \$TERMUX_PKG_SRCURL")
            sha=$(bash -c ". termux/packages/$pkg/build.sh 2>/dev/null; echo \$TERMUX_PKG_SHA256")
            file="sources/$pkg-$(basename "$url")"
            curl -fsSL "$url" -o "$file"
            echo "$sha  $file" | sha256sum -c -
          done
          tar -czf sources/termux-recipes.tar.gz -C termux packages/proot packages/libtalloc packages/libandroid-shmem
          echo "PROOT_VERSION=$(bash -c '. termux/packages/proot/build.sh 2>/dev/null; echo $TERMUX_PKG_VERSION')" >> "$GITHUB_ENV"
          tar -czf dist/jniLibs.tar.gz -C out/jniLibs .
          cp sources/* dist/
          (cd dist && sha256sum * > SHA256SUMS)
          (cd out/jniLibs && sha256sum */*.so) | tee dist/jniLibs.SHA256SUMS

      - name: Релиз proot-v${{ env.PROOT_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "proot-v$PROOT_VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "proot $PROOT_VERSION для DSH" \
            --notes "proot (GPL-2.0-or-later), talloc (LGPL-3.0-or-later), libandroid-shmem (Apache-2.0), собранные из исходников рецептами Termux (коммит в infra/proot/termux.lock). Исходники и рецепты — в этом релизе."
