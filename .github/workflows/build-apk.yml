name: Build Android APK

on:
  push:
    branches: [master, main]
    tags: ["android-v*", "app-v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Signing material comes from repository secrets. Without them the workflow still
      # builds a debug APK, so forks and PRs keep working.
      - name: Decode signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets; building debug APK"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Перед выпуском: образ из rootfs-manifest.json существует и его SHA-256 совпадают с APK,
      # содержимое тега bridge-плагина совпадает с contentSha256 (infra/README.md, RELEASING.md).
      - name: Verify rootfs and bridge against APK hashes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 -I .github/scripts/verify-release-coupling.py
          sh infra/rootfs/prepare-bridge.sh

      # Сначала модульные тесты (установщик, транзакции rootfs, semver, мост, политика доверия).
      - name: Unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build APK
        # Client id OAuth App для входа в GitHub (device flow): не секрет — переменная репозитория.
        # Пусто — приложение собирается, а «Вход через GitHub» честно говорит, что не настроен.
        env:
          DSH_GITHUB_CLIENT_ID: ${{ vars.DSH_GITHUB_CLIENT_ID }}
        run: |
          if [ "${{ env.SIGNED_BUILD }}" = "true" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare artifact name
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          if [ "${{ env.SIGNED_BUILD }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/dsh-mobile-${VERSION}-release.apk"
            echo "flavor=release" >> "$GITHUB_OUTPUT"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/dsh-mobile-${VERSION}-debug.apk"
            echo "flavor=debug" >> "$GITHUB_OUTPUT"
          fi
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-mobile-${{ steps.apk.outputs.flavor }}-${{ steps.apk.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Релиз — `gh` раннера, без сторонних действий.
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
