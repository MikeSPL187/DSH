name: Agent

# Агент DSH из исходников (agent/, форк deepseek-harness под MIT): зависимости — строго по agent/pnpm-lock.yaml
# (integrity каждого пакета), сборка — скриптами самого репозитория, итог — дерево `@deepseek-ai/dsh` как после
# установки из npm. Сверка с опубликованными в npm пакетами (infra/agent/compare-npm.py) показывает, что
# исходники соответствуют тому, что сейчас стоит в образе.

on:
  push:
    paths:
      - 'agent/**'
      - 'infra/agent/**'
      - '.github/workflows/agent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: node:24.22.1-trixie-slim@sha256:43b9ba1142b8dcf33fa8f922ca1be85714adc444e0586c7cf7726daaeabc1bea
    steps:
      - name: Инструменты
        run: apt-get update && apt-get install -y --no-install-recommends git python3 ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm (integrity)
        run: |
          cd /tmp
          node "$GITHUB_WORKSPACE/infra/rootfs/fetch-npm.js" https://registry.npmjs.org/pnpm/-/pnpm-11.28.5.tgz \
            sha512-SEVj0wtMKtJ8tIqpT/KzAtvOvI/2vyiBbCWJiG4UbOf3bzVPO8GkOOb16XaMMCqgpvet2CMpA81M+BQmy8FNng== pnpm.tgz
          npm install -g --no-audit --no-fund --ignore-scripts ./pnpm.tgz
          pnpm --version

      - name: Зависимости по lockfile
        working-directory: agent
        run: pnpm install --frozen-lockfile

      - name: Сборка
        working-directory: agent
        env:
          # Версия клиента вшивает коммит исходников: agent/ — тег dsh-v0.2.1-rc.2 upstream (см. third_party/README.md).
          DSH_CLIENT_COMMIT_HASH: 687f282e8625c6b8d11ff58211a90524be2e4317
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pnpm run build:artifacts

      - name: Дерево установки
        working-directory: agent
        run: |
          pnpm --filter @deepseek-ai/dsh deploy --prod --legacy --config.node-linker=hoisted ../out/dsh
          ls ../out/dsh ../out/dsh/node_modules/@deepseek-ai | head -50
          du -sh ../out/dsh

      - name: Сверка с npm
        run: python3 -I infra/agent/compare-npm.py out/dsh/node_modules out/compare-npm.json

      - name: Архив
        run: tar -czf out/agent-dsh.tar.gz -C out dsh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent
          path: |
            out/agent-dsh.tar.gz
            out/compare-npm.json
          retention-days: 14
