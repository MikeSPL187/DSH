name: Inspect native QA evidence

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Android device QA run in this repository
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/qa-evidence.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-device-qa
          run-id: ${{ inputs.run_id || '42142928087' }}
          github-token: ${{ github.token }}
          path: evidence
      - name: Read disposable device diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          for api in sorted(Path('evidence').glob('api-*')):
              print('\nDEVICE:', api.name, flush=True)
              for name in ['checks.json', 'failure.txt', 'package-probe.log', 'crash.log']:
                  path = api / name
                  if path.exists():
                      text = path.read_text()
                      text = re.sub(r'(?i)(token=)[^\s&]+', r'\1[redacted]', text)
                      print(name + ':\n' + text[-16000:], flush=True)
              dumps = sorted(api.glob('ui-*.xml'))
              if dumps:
                  nodes = ET.fromstring(dumps[-1].read_text()).iter('node')
                  print('LAST UI:', [(n.get('text'), n.get('content-desc'), n.get('enabled')) for n in nodes if n.get('text') or n.get('content-desc')], flush=True)
          PY
